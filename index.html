<body>

<div class="top" id="top">
<header class="bar">
  <div class="bar-in">
    <div class="logo">
      <span class="logo-mark" id="logoMark"></span>
      <div class="brand"><b>Monitoria e Segurança</b><div class="tags"><span>Protótipo navegável</span><span>Dados fictícios</span></div></div>
    </div>
    <button class="cbtn demo-t" id="demoToggle" data-act="demo" aria-expanded="false" aria-controls="demo"></button>
  </div>
  <div class="demo-wrap" id="demo" inert>
   <div class="demo-clip"><div class="bar-in demo-in">
    <div class="clock" title="Relógio da simulação">
      <span id="barClockIc"></span>
      <strong data-clock>06:55</strong>
      <span>sáb, 14 nov · simulação</span>
    </div>
    <div class="ctrls" role="group" aria-label="Controles da demonstração">
      <button class="cbtn" id="btnPlay" data-act="play"></button>
      <button class="cbtn" data-act="adv" data-m="5">+5 min</button>
      <button class="cbtn" data-act="adv" data-m="60">+1 h</button>
      <button class="cbtn" data-act="next">Próximo evento</button>
      <button class="cbtn prim" data-act="skiplogin">Entrar com perfis de demonstração</button>
      <button class="cbtn" id="btnSound" data-act="sound"></button>
      <button class="cbtn" data-act="reset">Reiniciar demo</button>
    </div>
   </div></div>
  </div>
</header>

<div class="switch" role="tablist" aria-label="Escolher tela">
  <button role="tab" class="on" data-act="view" data-v="phone">Mobile<i class="dot" id="dotPhone"></i></button>
  <button role="tab" data-act="view" data-v="desk">Desktop<i class="dot" id="dotDesk"></i></button>
</div>
</div>
<button class="top-tab" id="topTab" data-act="peek" aria-label="Mostrar cabeçalho"></button>

<main class="stage" id="stage" data-view="phone">
  <section class="phonew" aria-label="Versão mobile">
    <div class="dev-label">Mobile</div>
    <div class="phone">
      <div class="glass">
        <div class="sbar"><span data-clock>06:55</span><i class="notch"></i><span id="sigIc"></span></div>
        <div class="screen" id="dev-phone"></div>
      </div>
    </div>
  </section>
  <section class="deskw" aria-label="Versão desktop">
    <div class="dev-label">Desktop</div>
    <div class="desk">
      <div class="chrome"><span><i></i><i></i><i></i></span><div class="url" id="urlBar">monitoria.app/painel</div></div>
      <div class="screen" id="dev-desk"></div>
    </div>
  </section>
</main>
